name: checks
on: [push, pull_request]
jobs:
  # Both areas at the commits this workshop pins, on every system a user may have.
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows, as for a user's agent; setup-python provides `python` everywhere.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Translation area
        working-directory: agentic-translate
        run: |
          env PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tools -p 'test_*.py'
          python -B tools/knowledge.py --config knowledge/config.json init
          python -B tools/knowledge.py --config knowledge/config.json import-terms --input knowledge/knowledge.jsonl
          python -B tools/knowledge.py --config knowledge/config.json import-lugat --input knowledge/sources/db_lugat.sql
          python -B tools/knowledge.py --config knowledge/config.json integrity
      - name: Terminology area
        working-directory: punctual-term-translation
        run: |
          env PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
          python -B tools/terms.py check
