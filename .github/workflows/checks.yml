name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # Both areas at the commits this workshop pins, on every system a user may have.
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows, as for a user's agent; setup-python provides `python` everywhere.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Workshop setup (builds the term database)
        run: python -B workshop.py
      - name: Translation area
        working-directory: agentic-translate
        run: |
          env PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tools -p 'test_*.py'
      - name: Terminology area
        working-directory: punctual-term-translation
        run: |
          env PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
          python -B tools/terms.py check
